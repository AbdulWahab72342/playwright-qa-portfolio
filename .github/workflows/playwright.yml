name: Playwright Tests

on:
  # Branch pushes are covered by the pull_request run; this avoids running twice.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Official Playwright image: browsers and system libraries are preinstalled,
    # so no apt-get step is needed. Keep the tag in sync with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
